# GitHub Actions: збірка модуля app та інструментовані тести (ЛР3).
# Результати Gradle та тестів видно у вкладці Actions → відповідний run → job logs.

name: Android tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  instrumented-tests:
    # ubuntu-latest без KVM: x86-емулятор у софтвері, довгий boot, pm/settings → Broken pipe при install APK.
    # macos-latest (Apple Silicon) + arm64-v8a — стабільніший AVD для CI.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Log Python version
        run: python3 --version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64-v8a
          target: google_apis
          script: ./gradlew connectedDebugAndroidTest --stacktrace --no-daemon
